# ============================================
# TalentTrack Portal - CI/CD Pipeline
# GitHub Actions Workflow
# ============================================

name: TalentTrack CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/talenttrack-frontend
  DOCKER_IMAGE_BACKEND: ${{ secrets.DOCKER_USERNAME }}/talenttrack-backend

jobs:
  # ==========================================
  # Job 1: Lint & Test
  # ==========================================
  lint-and-test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: 📦 Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 Lint frontend
        working-directory: ./frontend
        run: npm run build  # Build check serves as lint for Vite projects

      - name: 📦 Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: ✅ Test backend
        working-directory: ./backend
        run: |
          echo "Running backend smoke tests..."
          node -e "
            const app = require('./src/routes/health');
            console.log('✅ Health module loads successfully');
          "
          echo "✅ All checks passed"

  # ==========================================
  # Job 2: Build & Push Docker Images
  # ==========================================
  build-docker:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_BACKEND }}:latest
            ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

