# Prometheus Configuration for TalentTrack Portal
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'talenttrack-backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['backend:3001']
        labels:
          service: 'talenttrack-api'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
